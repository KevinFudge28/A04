```html
<!DOCTYPE html>
<!-- Tells the browser that this document uses HTML5. -->

<html lang="en">
<!-- Starts the HTML document and specifies that the page is written in English. -->

<head>
    <!-- Starts the head section, which contains information about the webpage. -->

    <meta charset="UTF-8">
    <!-- Sets the character encoding so that text and symbols display correctly. -->

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Makes the webpage display properly on computers, tablets, and phones. -->

    <title>My First Web Page</title>
    <!-- Sets the title that appears in the browser tab. -->

</head>
<!-- Ends the head section. -->

<body>
    <!-- Starts the body section, which contains everything displayed on the webpage. -->

    <h1>My First Web Page</h1>
    <!-- Displays the main heading of the webpage. -->

    <p><strong>Username:</strong> kmf</p>
    <!-- Displays your username/UCID. -->

    <p><strong>Course Name:</strong> Intro to Website Development</p>
    <!-- Displays the name of the course. -->

    <p><strong>Course Number:</strong> IS 117</p>
    <!-- Displays the course number. -->

    <p><strong>Course Section:</strong> 003</p>
    <!-- Displays your course section.  -->

    <footer>
        <!-- Starts the footer section at the bottom of the webpage. -->

        <p>&copy; Kevin Fudge, 10/6/2026</p>
        <!-- Displays the copyright symbol, your name, and the assignment due date. -->

    </footer>
    <!-- Ends the footer section. -->

</body>
<!-- Ends the body section. -->

</html>
<!-- Ends the HTML document. -->
```
